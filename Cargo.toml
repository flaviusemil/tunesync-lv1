# Tune Remote - Rust workspace.
#   crates/tunesync      the library: Tune tables, MIDI -> intent, coalescing, discovery +
#                        apply against a Mixer trait, the engine, settings, the log ring.
#                        No LV1 in it, so Headlink can reuse it.
#   crates/rtpmidi       RTP-MIDI (AppleMIDI): codec + a session several peers join.
#   crates/lv1-surface   LV1's surface-driver interface (WMSD) in Rust: the ABI, the
#                        exports macro, guarded calls into LV1.
#   crates/host          TuneSync running: worker, MIDI by name, RTP-MIDI + DNS-SD, files.
#   crates/control       TuneSync_Control.dll: the shim LV1 loads.
#   crates/capi          the runtime as a C library (include/tunesync.h), for Headlink.
#   crates/sim           a fake LV1 (MixerCoreSG + host) to run the DLL under Wine.
# Build and test: tools/cargo.sh (runs in the tunesync-build:1 image).
[workspace]
resolver = "2"
members = ["crates/tunesync", "crates/rtpmidi", "crates/lv1-surface", "crates/host", "crates/control", "crates/capi", "crates/sim", "crates/ui"]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flaviusemil/tunesync-lv1"
publish = false

[profile.release]
opt-level = 2
debug = 1
