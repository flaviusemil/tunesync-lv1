[package]
name = "tunesync-control"
description = "TuneSync_Control.dll: the eMotion LV1 surface driver, a shim over tunesync-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tunesync_control"
crate-type = ["cdylib", "rlib"]

[dependencies]
tunesync = { path = "../tunesync" }
tunesync-host = { path = "../host" }
lv1-surface = { path = "../lv1-surface" }
rtpmidi = { path = "../rtpmidi" }
tunesync-ui = { path = "../ui" }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.58.0"
features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
]
