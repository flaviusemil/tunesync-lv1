[package]
name = "tunesync-control"
description = "TuneSync_Control.dll: the eMotion LV1 surface driver, a shim over tunesync-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tunesync_control"
crate-type = ["cdylib", "rlib"]

[dependencies]
tunesync = { path = "../tunesync" }
tunesync-host = { path = "../host" }
lv1-surface = { path = "../lv1-surface" }
