[package]
name = "tunesync-host"
description = "TuneSync running: worker threads, settings and log files, MIDI by name, the RTP-MIDI service with DNS-SD"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tunesync = { path = "../tunesync" }
rtpmidi = { path = "../rtpmidi" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_Dns",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_UI_Shell",
]
