<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TuneSync">
  <title>TuneSync</title>
  <!-- tile: the product's panel colour, so the mark carries its own ground on dark and light pages -->
  <rect width="64" height="64" rx="14" fill="#1f2228"/>
  <!-- tuning fork: one stem opening into two matched tines (weight 7, bend radius 11, filleted crotch) -->
  <path fill="#3fb37f" d="M18 7h7V21.5a7.5 7.5 0 0 0 15 0V7h7V21.5A14.5 14.5 0 0 1 37.89 34.96A3 3 0 0 0 36 37.75V49h-7V37.75A3 3 0 0 0 27.11 34.96A14.5 14.5 0 0 1 18 21.5Z"/>
  <!-- the one note that sets the key: its stem is the fork's stem -->
  <ellipse cx="27.32" cy="50.5" rx="9" ry="6.4" transform="rotate(-22 27.32 50.5)" fill="#e8eaed"/>
</svg>
